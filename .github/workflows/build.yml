name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4fe1266a2b85fa0a12e8c20202d04a62cd201f9d # v5.0.0 (o la versión exacta que corresponda)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
